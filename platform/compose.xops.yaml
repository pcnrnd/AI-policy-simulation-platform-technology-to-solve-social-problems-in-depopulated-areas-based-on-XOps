# xops-service(DataOps+MLOps) + frontend 앱 실행(project=platform).
# 기동: docker compose -f platform/compose.xops.yaml up -d --build
# 접속: http://localhost:8080 (프론트) — /api는 nginx가 xops-service:8000으로 프록시
#
# 저장소 3종(pg·timescale·mongo)은 compose.db.yaml(project=population-db)로 분리했다.
# 외부망 population-db-data와 DB 묶음을 먼저 준비한다 — deploy/db-separation-runbook.md 참고.
#   pg        — postgis 이미지라 PostgreSQL과 PostGIS를 한 인스턴스에서 제공 (ds_01~04, ds_06)
#   timescale — 시계열 (ds_05). 카탈로그가 소스 유형으로 Adapter를 나누므로 별 인스턴스로 둔다
#   mongo     — 문서형 (ds_07)
# DSN을 비우면 xops-service는 InMemoryAdapter로 degrade하므로 DB 없이도 기동된다.
services:
  xops-service:
    build: ./backend/xops-service
    environment:
      - XOPS_ENVIRONMENT=dev
      # prod 전환 시: XOPS_ENVIRONMENT=prod + XOPS_JWT_SECRET(필수) + XOPS_CLIENT_ID/SECRET
      - XOPS_MOCK_DATA_PATH=/app/seed/mock_data.json # settings.py 기본 경로는 컨테이너(/app)에서 안 풀림
      # 실 저장소 DSN — 컨테이너 네트워크 DNS 사용(호스트 포트가 아니라 내부 5432/27017).
      # 드라이버(requirements-db.txt)가 이미지에 없으면 이 값이 있어도 In-Memory로 degrade한다.
      - XOPS_PG_DSN=postgresql://xops:xops@pg:5432/xops_dataops
      - XOPS_TIMESCALE_DSN=postgresql://xops:xops@timescale:5432/xops_timeseries
      - XOPS_MONGO_URI=mongodb://xops:xops@mongo:27017/xops_documents?authSource=admin
      # 조회 전용 클라이언트(타 부서 서버 보관) — 값은 기동 환경(.env)에서 주입, 미설정이면 비활성.
      - XOPS_READONLY_CLIENT_ID=${XOPS_READONLY_CLIENT_ID:-}
      - XOPS_READONLY_CLIENT_SECRET=${XOPS_READONLY_CLIENT_SECRET:-}
    healthcheck:
      # 생존 확인(liveness) — 프로세스가 GET /에 응답하는지만 본다. DB 준비(readiness)가 아니다.
      # slim 이미지에 curl이 없어 python urllib을 쓴다(비-2xx·연결 실패는 예외 → 종료코드 1).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - xops-data:/app/data # SQLite 영속화 (사용자 소스·모델 버전·실행 이력)
      # Dockerfile이 main.py·src만 COPY해 이미지에 시드가 없다 → 프론트와 같은 파일을 읽기전용 마운트.
      # bind mount라 호스트 체크아웃이 필요하다. 이미지 단독 배포가 필요하면 build context를 platform/으로 올려 COPY할 것.
      - ./frontend/src/assets/mock_data.json:/app/seed/mock_data.json:ro
    ports:
      # 직접 접근/디버깅용 (프론트는 내부 네트워크로 접근). 호스트 8000이 다른 프로젝트에
      # 점유된 개발 환경에서는 XOPS_HOST_PORT 로 바꾼다 — 컨테이너 내부 포트는 8000 고정.
      - "${XOPS_HOST_PORT:-8000}:8000"
    # DB는 별도 project(population-db)라 depends_on으로 기다릴 수 없다 — DB 준비는 runbook의 readiness 검사로 확인한다.
    networks:
      - default
      - db-data
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      APP_PUBLIC_PATH: ${APP_PUBLIC_PATH:-/rnd/population/}
      DASHBOARD_UPSTREAM: ${DASHBOARD_UPSTREAM:-}
      DASHBOARD_UPSTREAM_BASE_PATH: ${DASHBOARD_UPSTREAM_BASE_PATH:-/}
      DASHBOARD_PUBLIC_PATH: ${DASHBOARD_PUBLIC_PATH:-${APP_PUBLIC_PATH:-/rnd/population/}dashboard/}
      DASHBOARD_API_UPSTREAM: ${DASHBOARD_API_UPSTREAM:-}
      DASHBOARD_API_UPSTREAM_BASE_PATH: ${DASHBOARD_API_UPSTREAM_BASE_PATH:-/}
      DASHBOARD_API_PUBLIC_PATH: ${DASHBOARD_API_PUBLIC_PATH:-${APP_PUBLIC_PATH:-/rnd/population/}dashboard-api/}
      DASHBOARD_SUPPORTED_MODES: ${DASHBOARD_SUPPORTED_MODES:-}
      REPORTING_UPSTREAM: ${REPORTING_UPSTREAM:-}
      REPORTING_UPSTREAM_BASE_PATH: ${REPORTING_UPSTREAM_BASE_PATH:-/}
      REPORTING_PUBLIC_PATH: ${REPORTING_PUBLIC_PATH:-${APP_PUBLIC_PATH:-/rnd/population/}reporting/}
      REPORTING_API_UPSTREAM: ${REPORTING_API_UPSTREAM:-}
      REPORTING_API_UPSTREAM_BASE_PATH: ${REPORTING_API_UPSTREAM_BASE_PATH:-/}
      REPORTING_API_PUBLIC_PATH: ${REPORTING_API_PUBLIC_PATH:-${APP_PUBLIC_PATH:-/rnd/population/}reporting-api/}
      REPORTING_SUPPORTED_MODES: ${REPORTING_SUPPORTED_MODES:-}
    depends_on:
      - xops-service
    ports:
      # 호스트 8080 점유 시 XOPS_FRONTEND_HOST_PORT 로 변경 (내부 80 고정)
      - "${XOPS_FRONTEND_HOST_PORT:-8080}:80"
    restart: unless-stopped

# 저장소 3종은 compose.db.yaml(project=population-db)이 관리한다. 이 망은 그쪽과 공유하는 외부망이며
# 이 Compose가 만들지 않는다 — 없으면 기동이 실패한다(runbook의 단회 생성 절차 참고).
networks:
  db-data:
    external: true
    name: population-db-data

volumes:
  xops-data:
