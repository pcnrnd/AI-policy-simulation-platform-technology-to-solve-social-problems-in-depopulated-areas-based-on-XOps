server {
  listen 80;

  # /api는 xops-service(compose 네트워크 DNS)로 프록시 — 브라우저는 동일 오리진 사용(CORS 불필요)
  location /api/ {
    proxy_pass http://xops-service:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # API 계약(OpenAPI) — FastAPI는 /openapi.json을 루트에 두어 위 /api/ 블록으로는 닿지 않는다.
  # 정확 일치 location으로 이어 준다. 같은 도메인의 로그인 게이트 뒤에서만 열리고 /docs는 열지 않는다.
  location = /api/v3/openapi.json {
    proxy_pass http://xops-service:8000/openapi.json;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # 타 부서 화면 자리(같은 도메인 경로 분리) — 경로 이름·upstream 이름·포트는 타 부서 확정 후 채운다.
  # 피할 경로: /api/ (우리 API), /assets/ (Vite 산출물), /authelia/ (로그인 게이트).
  # location /department/ {
  #   proxy_pass http://department-upstream:80;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  # }

  # SPA — 정적 자산 + 클라이언트 라우팅 폴백
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
