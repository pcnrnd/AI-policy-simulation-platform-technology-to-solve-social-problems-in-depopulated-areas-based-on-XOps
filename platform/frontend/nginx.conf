server {
  listen 80;

  # /api는 xops-service(compose 네트워크 DNS)로 프록시 — 브라우저는 동일 오리진 사용(CORS 불필요)
  location /api/ {
    proxy_pass http://xops-service:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA — 정적 자산 + 클라이언트 라우팅 폴백
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
