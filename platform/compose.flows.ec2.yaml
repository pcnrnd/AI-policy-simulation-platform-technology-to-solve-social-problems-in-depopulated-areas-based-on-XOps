# 운영(dts·EC2) flows DB 덮어쓰기 — compose.flows.yaml 위에 겹친다.
# 기동: docker compose -p population-flows --env-file platform/deploy/.env --env-file platform/deploy/db.volumes.env \
#         -f platform/compose.flows.yaml -f platform/compose.flows.ec2.yaml up -d
#
# 이미지는 기존 pg 컨테이너와 같은 바이너리(POP_DB_PG_IMAGE RepoDigest)로 고정하고 pull하지 않는다.
# 포트는 서버 안에서 점검·적재할 때만 쓰도록 127.0.0.1에만 묶는다. 5433(pg)·5434(timescale)·27017(mongo)과 겹치지 않는 5435.
# 비밀번호는 볼륨을 처음 만들 때만 적용된다 — 기존 볼륨이 있으면 바꿔도 반영되지 않는다.
services:
  flows-db:
    image: ${POP_DB_PG_IMAGE:?deploy/db.volumes.env에 POP_DB_PG_IMAGE 필요}
    pull_policy: never
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?deploy/.env에 DB_PASSWORD 필요}
    ports:
      - "127.0.0.1:5435:5432"
