[project]
name = "xops-service"
version = "0.1.0"
description = "DataOps + MLOps 운영 평면 서비스 (인구감소 R&D platform)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
# 선택: 설치 시 실제 SHAP 사용, 없으면 순수 Python fallback
ml = [
    "numpy>=1.26",
    "shap>=0.44",
]
# 선택: 실 저장소 연결 드라이버. 미설치 시 InMemoryAdapter 로 degrade한다.
# PostgreSQL·PostGIS·TimescaleDB 는 psycopg 하나로 처리한다(모두 Postgres 프로토콜).
db = [
    "psycopg[binary]>=3.1",
    "pymongo>=4.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

# 선택 의존성(db·ml extra). 설치 환경에서는 패키지 자체의 타입 정보를 쓰고, 미설치 환경에서만
# import 해석 실패를 무시한다 — 코드의 `# type: ignore[import-not-found]` 는 설치 환경에서
# unused-ignore 로 뒤집히므로 쓰지 않는다.
[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*", "pymongo", "pymongo.*", "shap", "shap.*"]
ignore_missing_imports = true
