# docker compose -f cert-compose.yml up -d --build
# 두 서비스는 각자 독립 이미지(chart_speed/Dockerfile, chart_type/Dockerfile)를 쓴다.
services:
  speed:
    image: cert-chart-speed:2026.0.0
    build: ./chart_speed
    ports:
      - "8505:8505"
    volumes:
      - ./chart_speed:/app
  types:
    image: cert-chart-type:2026.0.0
    build: ./chart_type
    ports:
      - "8506:8506"
    volumes:
      - ./chart_type:/app
