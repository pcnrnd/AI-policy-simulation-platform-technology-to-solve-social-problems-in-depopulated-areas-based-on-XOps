# docker compose -f cert-compose.yml up -d --build
# 두 서비스는 각자 독립 이미지(chart_speed/Dockerfile, chart_type/Dockerfile)를 쓴다.
services:
  speed:
    build: ./chart_speed
    environment:
      CHART_SLEEP_MS: "350"   # 응답속도 데모용 차트당 지연 — Firefox 기준 총 ~2초. 조절 가능
    ports:
      - "8505:8505"
    volumes:
      - ./chart_speed:/app
  types:
    build: ./chart_type
    ports:
      - "8506:8506"
    volumes:
      - ./chart_type:/app
